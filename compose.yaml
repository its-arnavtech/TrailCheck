services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trailcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trailcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - trailcheck-postgres:/var/lib/postgresql/data

volumes:
  trailcheck-postgres:
