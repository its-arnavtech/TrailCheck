name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/trailcheck-web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/trailcheck-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/trailcheck-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trailcheck
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trailcheck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trailcheck?schema=public
      JWT_SECRET: ci-test-secret-ci-test-secret-1234
      FRONTEND_ORIGIN: http://localhost:3000
      THROTTLE_TTL_SECONDS: 60
      THROTTLE_LIMIT: 120
      GEMINI_API_KEY: ""
      NPS_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/trailcheck-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm test

      - name: End-to-end
        run: npm run test:e2e

      - name: Build
        run: npm run build

  ml:
    name: ML smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/trailcheck-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: pip install -r ml/requirements-smoke.txt

      - name: Dataset, eval, and CPU smoke tests
        run: python -m unittest discover -s ml/tests -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan tracked files
        run: node scripts/scan-secrets.mjs
